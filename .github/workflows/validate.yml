# Gate for the files this repository serves to every other repository.
#
# GitHub drops a malformed form silently, and this repository has no build,
# no tests, and no other feedback loop. This workflow is the only thing that
# fails loudly when a default breaks.
#
# Authoring rules come from the CONTRIBUTING.md this repository publishes:
# explicit triggers, pinned actions, empty top-level permissions with per-job
# grants, a timeout on every job, a concurrency group, and logic in a script
# rather than inline YAML.

name: Validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    name: Issue and discussion forms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check --quiet 'pyyaml==6.0.2'

      - name: Validate templates
        run: python3 scripts/validate-templates.py

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2
