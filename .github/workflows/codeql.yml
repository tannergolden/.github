# Static analysis over this repository's own code.
#
# Two things here are worth analyzing. `scripts/validate-templates.py` decides
# whether a malformed form ships to every repository on the account, and the
# workflows in this directory run with credentials attached. Neither had a
# reader: this repository has no build and no tests, and `validate.yml` checks
# the forms rather than the code that checks them.
#
# Called, never copied. The scanner is published once in
# tannergolden/standards and every repository calls the same one, so a fix
# there arrives here without an edit here.
#
# `@v1` IS THE PIN, AND IT MOVES ON PURPOSE. That tag is repointed at each
# release in the v1 line, so a fix upstream reaches this repository without a
# pull request here, which is the whole reason the logic is shared rather than
# copied. Immutability lives at the release being reviewed, not at the call
# site. A major is the one thing the tag never crosses.
#
# No `timeout-minutes` below, because a job that calls a reusable workflow
# cannot carry one. The called workflow sets its own, per job.
#
# Languages are detected from the tree upstream, so nothing here declares one.
# TODAY THAT MEANS THE PYTHON AND NOTHING ELSE: the detection that emits
# GitHub Actions as a language of its own landed after the release `@v1`
# currently points at, so these workflows join the analysis on the next
# release that moves the tag.
#
# Analysis needs a public repository (or Advanced Security); this one is
# public because the defaults would not otherwise be served, so the job runs.

name: Security Audit

on:
  push:
    branches: ['Development']
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly, so a new query pack reaches untouched code
  workflow_dispatch:

permissions: {}

concurrency:
  # An analysis in flight is never canceled: a partial upload would replace a
  # complete one, and the next scheduled sweep is a week away.
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    permissions:
      actions: read # CodeQL resolves workflow run metadata during analysis
      contents: read # walk the checkout to build the language matrix
      security-events: write # upload CodeQL results to code scanning
    uses: tannergolden/standards/.github/workflows/codeql.yml@v1
