# Pull request validation, called from tannergolden/standards.
#
# Separate from `checks.yml` because these need `pull_request_target`: a
# fork's pull request runs with a read-only token on `pull_request`, and a
# status check cannot be published from there.
#
# ⚠️ `pull_request_target` RUNS WITH THIS REPOSITORY'S TOKEN AGAINST A BASE
# CHECKOUT. The called workflow has no checkout of pull request code at all
# and reads titles and trailers through the API, which is why the account's
# shared zizmor configuration accepts the trigger for this file name. That
# acceptance is keyed to the NAME `governance.yml`, so renaming this file
# silently drops the exemption and reddens the workflow lint.
#
# ⚠️ RULESET-LOAD-BEARING JOB ID. `pr` reports as 'pr / ✍️ DCO Sign-Off'.
# Renaming it leaves branch protection waiting on a check that never reports.
#
# Only the `pr` job is installed. The wider governance workflow labels, greets
# and sweeps stale threads, which is triage this repository does not do: it
# holds files that other repositories inherit, and issues about them are
# raised in the repository that inherited them.

name: Governance

on:
  pull_request_target:
    # `edited` re-validates a corrected title; the rest are idempotent.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # RULESET-LOAD-BEARING JOB ID: reports as 'pr / ✍️ DCO Sign-Off'.
  pr:
    permissions:
      pull-requests: read # read the PR title under validation
      statuses: write # publish the semantic-title status check on the PR
    uses: tannergolden/standards/.github/workflows/semantic-pr.yml@v1
