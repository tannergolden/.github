# Keeps the pinned actions in this repository's own CI current.
#
# This file is NOT one of the defaults this repository serves. GitHub reads a
# `dependabot.yml` only from the repository that owns it, so nothing here
# reaches any other repository: it maintains the two workflows under
# `.github/workflows/` and nothing else. Every repository that wants this
# needs its own copy.
#
# WHY IT EXISTS AT ALL. The contributing guide this repository publishes asks
# for pinned actions, and a pin nobody moves is a pin that holds one
# eventually-vulnerable revision forever. The pin is the safety property;
# this is what keeps it maintainable. Dependabot rewrites the commit and the
# trailing version comment together, so the readable half cannot drift from
# the revision it names.
#
# Grouped, so a month's updates arrive as one pull request rather than one per
# action, and the `build` prefix keeps the merged commit a Conventional
# Commit.
#
# THE SETTINGS BELOW ARE THE ACCOUNT'S, NOT THIS REPOSITORY'S. Every
# repository that runs Dependabot runs the same configuration, cadence,
# grouping and labels alike, so the decision is made once rather than drifting
# into a slightly different file per repository.
#
# `dependencies` Dependabot creates when it is missing. `type: build` is part
# of the account's label taxonomy, which a repository provisions by running
# 🎯 Apply Standards once; until that runs here the label is simply absent,
# and Dependabot warns and opens the pull request anyway.

version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '07:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - 'type: build'
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
